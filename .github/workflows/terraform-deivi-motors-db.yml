name: Deploy MongoDB Atlas (Terraform)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform Mongo Atlas
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mongoatlas

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        env:
          TF_VAR_mongo_atlas_org_id: ${{ secrets.MONGO_ATLAS_ORG_ID_FINAL }}
          TF_VAR_mongo_atlas_public_key: ${{ secrets.MONGO_ATLAS_PUBLIC_KEY_FINAL }}
          TF_VAR_mongo_atlas_private_key: ${{ secrets.MONGO_ATLAS_PRIVATE_KEY_FINAL }}
          TF_VAR_mongo_deivimotorsdb_username: ${{ secrets.DEIVI_MOTORS_MONGO_DB_USER }}
          TF_VAR_mongo_deivimotorsdb_password: ${{ secrets.DEIVI_MOTORS_MONGO_DB_PASSWORD }}
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        env:
          TF_VAR_mongo_atlas_org_id: ${{ secrets.MONGO_ATLAS_ORG_ID_FINAL }}
          TF_VAR_mongo_atlas_public_key: ${{ secrets.MONGO_ATLAS_PUBLIC_KEY_FINAL }}
          TF_VAR_mongo_atlas_private_key: ${{ secrets.MONGO_ATLAS_PRIVATE_KEY_FINAL }}
          TF_VAR_mongo_deivimotorsdb_username: ${{ secrets.DEIVI_MOTORS_MONGO_DB_USER }}
          TF_VAR_mongo_deivimotorsdb_password: ${{ secrets.DEIVI_MOTORS_MONGO_DB_PASSWORD }}
        run: terraform plan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        env:
          TF_VAR_mongo_atlas_org_id: ${{ secrets.MONGO_ATLAS_ORG_ID_FINAL }}
          TF_VAR_mongo_atlas_public_key: ${{ secrets.MONGO_ATLAS_PUBLIC_KEY_FINAL }}
          TF_VAR_mongo_atlas_private_key: ${{ secrets.MONGO_ATLAS_PRIVATE_KEY_FINAL }}
          TF_VAR_mongo_deivimotorsdb_username: ${{ secrets.DEIVI_MOTORS_MONGO_DB_USER }}
          TF_VAR_mongo_deivimotorsdb_password: ${{ secrets.DEIVI_MOTORS_MONGO_DB_PASSWORD }}
        run: terraform apply -auto-approve
